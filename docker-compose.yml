services:
  bez_bagov:
    container_name: bez_bagov
    env_file: ./.env
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./bez_bagov/db.sqlite3:/application/bez_bagov/db.sqlite3
      - ./media:/application/bez_bagov/media
    depends_on:
      redis:
        condition: service_healthy

  tg_poll:
    container_name: bez_bagov_tg_poll
    env_file: ./.env
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: []
    working_dir: /application/bez_bagov
    command: poetry run python manage.py tg_poll
    restart: unless-stopped
    volumes:
      - ./bez_bagov/db.sqlite3:/application/bez_bagov/db.sqlite3
      - ./media:/application/media
    depends_on:
      redis:
        condition: service_healthy

  redis:
    container_name: bez_bagov_redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(awk '/^requirepass/{print $$2}' /usr/local/etc/redis/redis.conf) redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  redis_data: