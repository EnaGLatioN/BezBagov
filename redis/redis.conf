# Сеть
bind 0.0.0.0
protected-mode yes
port 6379
tcp-keepalive 60
timeout 300

# Авторизация
requirepass your_strong_password

# Персистентность
dir /data
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
save ""

# Память
maxmemory 256mb
maxmemory-policy allkeys-lru

# Логи
loglevel notice
logfile ""